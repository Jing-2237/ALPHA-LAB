[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-lab"
version = "0.1.0"
description = "Differential-drive robot control and reproducible simulation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
alpha-sim = "alpha_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["alpha_lab*"]
