name: robot-control-ci
on: [push, pull_request]
jobs:
  simulation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m alpha_lab --config config/robot.json --mission config/mission.json
      - run: python -m alpha_lab --obstacle-at 2 --output outputs/obstacle
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-python-${{ matrix.python-version }}
          path: outputs/
